name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt plus pytest/ruff/
        # coverage — the Docker image built in a later step installs only
        # requirements.txt, so this is where test/lint tooling stays scoped
        # to CI and local dev.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (no live API calls, coverage gate at 70%)
        # GROQ_API_KEY is intentionally NOT set here — the whole point of
        # Phases 1-3's lazy-client/DI work was making the default suite run
        # without a real key. live_api-marked tests are excluded by
        # pytest.ini's addopts, so this never attempts a real Groq call.
        # --ignore=tests/spark: those tests need Java and PySpark, which only
        # the separate `spark` job below installs (Phase 7).
        run: pytest -m "not live_api" --ignore=tests/spark --cov=src --cov=ingestion --cov-report=term-missing --cov-fail-under=70

  # Builds the deploy image on every push and reports its size against
  # Artifact Registry's 0.5GB free-tier limit (Phase 5) — catches a build
  # break or a size regression immediately, before it's ever a problem on
  # the personal machine doing the real Cloud Run deploy. Nothing here is
  # pushed anywhere and no GCP credentials are involved.
  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t analyst:ci .

      - name: Report image size
        run: |
          echo "Uncompressed:"
          docker image inspect analyst:ci --format='{{.Size}}' | numfmt --to=iec
          echo "Compressed (what actually counts against Artifact Registry's 0.5GB free tier):"
          docker save analyst:ci | gzip | wc -c | numfmt --to=iec

      - name: Smoke test /health
        run: |
          docker run -d --name analyst-smoke -p 8080:8080 analyst:ci
          sleep 5
          curl --fail http://localhost:8080/health
          docker logs analyst-smoke
          docker stop analyst-smoke

  # Phase 7: the PySpark/Delta Lake tests for lakehouse/, in their own job so the
  # Java 17 + PySpark install (hundreds of MB) is not paid by the app and
  # ingestion tests above. One Python version is enough here (docs/PHASE7_DESIGN.md
  # D13), with its own 70% coverage gate measured on lakehouse/ only.
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Temurin is an OpenJDK build (not Oracle JDK). Spark 4.2 needs Java 17+.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Spark downloads the Delta jar from Maven Central on first use into an
      # "Ivy" cache folder; caching it saves that download on later runs. Which of
      # these two folders Spark 4.2 uses is a guess - cache whichever exists, and
      # check the run log for "Cache saved" after the first run.
      - name: Cache Spark package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('requirements-spark.txt') }}

      # Test tools plus Spark's own packages and nothing else, on purpose: the
      # app's packages (requirements.txt, via requirements-dev.txt) must not be
      # installed here, or a missing entry in requirements-spark.txt would go
      # unnoticed. Ruff is not needed - the `test` job lints the whole repo.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt -r requirements-spark.txt

      # --confcutdir=tests/spark stops pytest from loading conftest.py files above
      # that folder. tests/conftest.py is the app's: it imports fastapi and src.main
      # at the top and has an autouse fixture importing src.services, none of which
      # this job installs.
      - name: Run Spark tests (coverage gate at 70% on lakehouse/)
        run: pytest tests/spark --confcutdir=tests/spark --cov=lakehouse --cov-report=term-missing --cov-fail-under=70
